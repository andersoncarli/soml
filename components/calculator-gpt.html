<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        body {
            margin: 0; font-family: Arial, sans-serif; background: #1e1e1e; color: #fff;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .calculator {
            background: #333; padding: 20px; border-radius: 10px; width: 300px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
        }
        .calculator input {
            grid-column: span 4; padding: 10px; background: #222; color: #fff;
            border: none; text-align: right; font-size: 1.5em; border-radius: 5px;
        }
        .calculator button {
            padding: 15px; background: #555; color: #fff; border: none;
            font-size: 1em; border-radius: 5px; cursor: pointer;
        }
        .calculator button:active { background: #666; }
        .calculator button.clear { grid-column: span 2; background: #d9534f; }
        .calculator button.equals { grid-column: span 2; background: #5cb85c; }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendToDisplay('(')">(</button>
        <button onclick="appendToDisplay(')')">)</button>
        <button onclick="appendToDisplay('/')">÷</button>
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('*')">×</button>
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('-')">−</button>
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('+')">+</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="appendToDisplay('Math.PI')">π</button>
        <button onclick="appendToDisplay('Math.E')">e</button>
        <button onclick="appendToDisplay('Math.sqrt(')">√</button>
        <button onclick="appendToDisplay('Math.pow(')">^</button>
        <button onclick="calculate()">=</button>
    </div>

    <script>
        const display = document.getElementById('display');
        const appendToDisplay = value => display.value += value;
        const clearDisplay = () => display.value = '';
        const calculate = () => {
            try { display.value = eval(display.value); }
            catch { display.value = 'Error'; }
        }
    </script>
</body>
</html>
